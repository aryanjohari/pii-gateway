# Public / home-lab playground policy: the minimal demo entities plus the NZ identifiers.
# Used by the web playground so the NZ presets (NHI, IRD, driver licence) are really redacted.
# config.demo.yaml stays the smaller policy the README evaluation table is measured against.
# NLP on undeclared free text is best-effort (spaCy/Presidio); sample data only.
# After pulling updates, remount this file and restart the gateway container.
config_version: 1
redaction_entities:
  - EMAIL_ADDRESS
  - PERSON
  - PHONE_NUMBER
  - NZ_NHI
  - NZ_IRD
  - NZ_DRIVER_LICENCE
structured_field_rules:
  email: redact
  full_name: redact
  phone: redact
postgres_batch:
  enabled: false
  query_name: export_users
  queries: {}
batch_file_ingest:
  mode: local
  local_path: /data/inbox
  poll_seconds: 60
  s3_bucket: ""
  s3_prefix: ""
persistence:
  write_raw: false
  write_cleaned: false
