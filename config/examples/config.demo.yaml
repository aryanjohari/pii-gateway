# Public / home-lab demo policy: policy-first redaction for the playground.
# NLP on undeclared free text is best-effort (spaCy/Presidio); sample data only.
# After pulling updates, remount this file and restart the gateway container.
config_version: 1
redaction_entities:
  - EMAIL_ADDRESS
  - PERSON
  - PHONE_NUMBER
structured_field_rules:
  email: redact
  full_name: redact
  phone: redact
postgres_batch:
  enabled: false
  query_name: export_users
  queries: {}
batch_file_ingest:
  mode: local
  local_path: /data/inbox
  poll_seconds: 60
  s3_bucket: ""
  s3_prefix: ""
persistence:
  write_raw: false
  write_cleaned: false
