# NZ identifier policy: requests the NZ entities from Phase 3 plus NZ phone numbers.
# Used by the NZ eval (python -m eval.run_eval --policy config.nz.yaml --dataset dataset_nz.jsonl).
# Detection is best-effort; a valid checksum means a number is well-formed, not that it is issued.
config_version: 1
redaction_entities:
  - NZ_NHI
  - NZ_IRD
  - NZ_DRIVER_LICENCE
  - PHONE_NUMBER
structured_field_rules:
  phone: redact
postgres_batch:
  enabled: false
  query_name: export_users
  queries: {}
batch_file_ingest:
  mode: local
  local_path: /data/inbox
  poll_seconds: 60
  s3_bucket: ""
  s3_prefix: ""
persistence:
  write_raw: false
  write_cleaned: false
