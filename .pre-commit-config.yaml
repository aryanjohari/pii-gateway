# Mirrors the ruff checks in CI, limited to the same paths (`ruff check src tests`).
# The rev matches the ruff version the repo is linted with; bump them together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/
