title: PII Gateway
summary: Self-hosted API that redacts personal data from JSON, text, and batch files before downstream use.
description: >
  PII Gateway is a Docker-first service for teams that want one place to scrub
  emails, names, and other personal data before it reaches analytics, logs, or
  third-party tools. Call POST /v1/sanitize for live JSON and free text, or let
  optional jobs pull PostgreSQL exports and CSV or JSON inbox files on a schedule.
  A mounted policy file sets entity types and per-field rules; secrets stay in
  environment variables. Microsoft Presidio handles NLP detection; undeclared
  structured fields still get scanned so nothing slips through by default.
stack:
  - Python
  - FastAPI
  - Presidio
  - PostgreSQL
  - Docker
  - APScheduler
status: active
diagram: docs/architecture.mmd
