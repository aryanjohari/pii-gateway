title: PII Gateway
summary: Self-hosted API that redacts personal data from JSON and text via policy rules plus best-effort NLP.
description: >
  PII Gateway is a Docker-first personal/learning service that scrubs emails,
  names, and other personal data before it reaches analytics, logs, or
  experiments. Declared JSON fields use deterministic policy rules; free text
  and undeclared strings get best-effort Microsoft Presidio NLP—not an accuracy
  guarantee or compliance product. Call POST /v1/sanitize for live JSON and
  free text, or let optional jobs pull PostgreSQL exports and CSV or JSON inbox
  files. Secrets stay in environment variables; a mounted policy file sets
  entity types and per-field rules. Placeholders use one Presidio-style scheme
  (e.g. <EMAIL_ADDRESS>). The live demo at https://pii-gateway.arkhives.nz/
  is a Vercel edge page with a server-side BFF; sample data only. A home-lab
  Raspberry Pi can host the demo API behind Cloudflare Tunnel.
stack:
  - Python
  - FastAPI
  - Presidio
  - Next.js
  - PostgreSQL
  - Docker
  - APScheduler
status: active
